defaults:

  seed: 0
  method: name
  task: hike_foo
  logdir: /dev/null
  replay: uniform
  replay_size: 1e6
  replay_online: False
  eval_dir: ''
  filter: '.*'

  jax:
    platform: cpu
    jit: True
    precision: float16
    prealloc: True
    debug_nans: False
    logical_cpus: 0
    debug: False
    policy_devices: [0]
    train_devices: [0]
    metrics_every: 10

  run:
    script: train_eval
    steps: 1e6
    expl_until: 0
    log_every: 300
    save_every: 2000
    eval_every: 1e3
    eval_initial: True
    eval_eps: 10
    eval_samples: 10
    train_ratio: 32.0
    train_fill: 0
    eval_fill: 0
    log_zeros: False
    log_keys_video: None
    log_keys_sum: '^$'
    log_keys_mean: '(log_entropy)'
    log_keys_max: '^$'
    from_checkpoint: ''
    sync_every: 10
    actor_addr: 'ipc:///tmp/5551'
    actor_batch: 32
    shuffle_episodes: false
    episode_shuffle_seed: 0

  envs: {amount: 4, parallel: process, length: 0, reset: True, restart: True, discretize: 0, checks: False}
  wrapper: {length: 0, reset: True, discretize: 0, checks: False}
  env:
    atari: {size: [64, 64], repeat: 4, sticky: True, gray: False, actions: all, lives: unused, noops: 0, resize: opencv, flickering: 0.0, black: true}
    dmlab: {size: [64, 64], repeat: 4, episodic: True}
    minecraft: {size: [64, 64], break_speed: 100.0}
    dmc: {size: [64, 64], repeat: 2, camera: -1, flickering: 0.0, black: true}
    loconav: {size: [64, 64], repeat: 2, camera: -1}
    hike: {step_size: 0.1, transition_std: 0.05, observation_std: 0.1, discrete: false, altitude: false, rotations: false}
    spot: {data_dir: /embodied/processed_data, step_size: 0.3, transition_std: 0.05, observation_std: 0.1,}
    spotlive: {obs_keys: 'velocity|position|orientation|goal', policy_rate_hz: 3.5, max_episode_steps: 200, reach_threshold: 0.5, goal_timeout: 300.0, goal_schedule: ''}

  # Agent
  task_behavior: Greedy
  expl_behavior: None
  batch_size: 16
  batch_length: 64
  data_loaders: 8

  # World Model
  grad_heads: [decoder, reward, cont]
  rssm: {deter: 4096, units: 1024, stoch: 32, classes: 32, act: silu, norm: layer, initial: learned, unimix: 0.01, unroll: False, action_clip: 1.0, winit: normal, fan: avg}
  encoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, resize: stride, winit: normal, fan: avg, symlog_inputs: True, minres: 4}
  decoder: {mlp_keys: '.*', cnn_keys: '.*', act: silu, norm: layer, mlp_layers: 5, mlp_units: 1024, cnn: resnet, cnn_depth: 96, cnn_blocks: 0, image_dist: mse, vector_dist: symlog_mse, inputs: [deter, stoch], resize: stride, winit: normal, fan: avg, outscale: 1.0, minres: 4, cnn_sigmoid: False, outputs: '.*'}
  reward_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255}
  cont_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: binary, outscale: 1.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg}
  loss_scales: {image: 1.0, vector: 1.0, reward: 1.0, cont: 1.0, dyn: 0.5, rep: 0.1, actor: 1.0, critic: 1.0, slowreg: 1.0, physics: 0.0, multi_step: 0.0, bc: 0.0, real_td: 0.0}
  dyn_loss: {impl: kl, free: 1.0}
  rep_loss: {impl: kl, free: 1.0}
  multi_step_horizon: 0
  multi_step_loss: {impl: kl, free: 0.5}
  physics_dt: 0.2
  model_opt: {opt: adam, lr: 1e-4, eps: 1e-8, clip: 1000.0, wd: 0.0, warmup: 0, lateclip: 0.0}

  # Actor Critic
  actor: {layers: 2, units: 512, act: silu, norm: layer, minstd: 0.1, maxstd: 1.0, outscale: 1.0, outnorm: False, unimix: 0.01, inputs: [deter, stoch], winit: normal, fan: avg, symlog_inputs: False}
  critic: {layers: 2, units: 512, act: silu, norm: layer, dist: symlog_disc, outscale: 0.0, outnorm: False, inputs: [deter, stoch], winit: normal, fan: avg, bins: 255, symlog_inputs: False}
  actor_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  critic_opt: {opt: adam, lr: 3e-5, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0, lateclip: 0.0}
  actor_dist_disc: onehot
  actor_dist_cont: normal
  actor_grad_disc: reinforce
  actor_grad_cont: backprop
  critic_type: vfunction
  imag_horizon: 15
  imag_warmup: 0
  imag_unroll: False
  horizon: 333
  return_lambda: 0.95
  critic_slowreg: logprob
  slow_critic_update: 1
  slow_critic_fraction: 0.02
  retnorm: {impl: perc_ema, decay: 0.99, max: 1.0, perclo: 5.0, perchi: 95.0}
  actent: 3e-4

  # Exploration
  expl_rewards: {extr: 1.0, disag: 0.1}
  expl_opt: {opt: adam, lr: 1e-4, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0}
  disag_head: {layers: 5, units: 1024, act: silu, norm: layer, dist: mse, outscale: 1.0, inputs: [deter, stoch, action], winit: normal, fan: avg}
  disag_target: [stoch]
  disag_models: 8

atari:

  task: atari_pong
  envs.amount: 8
  run:
    steps: 5.5e7
    eval_eps: 10
    train_ratio: 64
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: 'info_.*', cnn_keys: 'image|info_.*'}

atari100k:

  task: atari_pong
  envs: {amount: 1}
  env.atari: {gray: False, repeat: 4, sticky: False, noops: 30, actions: needed, flickering: 0.0, black: true}
  run:
    script: train_eval
    steps: 1.5e5
    eval_every: 1e3
    eval_initial: False
    eval_eps: 100
    train_ratio: 1024
  jax.precision: float32
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units$: 512
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: 'info_.*', cnn_keys: 'image|info_.*'}

hike:

  task: hike_foo
  envs: {amount: 8}
  wrapper.length: 160
  run:
    script: train_eval
    steps: 1e6
    eval_initial: False
    eval_eps: 100
    eval_every: 1e3
    log_every: 1e3
  jax.precision: float32
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units$: 512
  encoder: {mlp_keys: 'vector', cnn_keys: '$^'}
  decoder: {mlp_keys: 'vector|info_.*', cnn_keys: 'info_.*'}

dmc_vision:

  task: dmc_walker_walk
  run.train_ratio: 512
  rssm.deter: 512
  run.steps: 2e6
  run.eval_every: 1e4
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units: 512
  encoder: {mlp_keys: '$^', cnn_keys: 'image'}
  decoder: {mlp_keys: 'info_.*', cnn_keys: 'image|info_.*'}

dmc_velocity:

  task: dmc_walker_walk
  run.train_ratio: 512
  run.steps: 1e6
  run.eval_every: 1e4
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units: 512
  encoder: {mlp_keys: 'velocity|.*target.*', cnn_keys: '$^'}
  decoder: {mlp_keys: 'velocity|.*target.*|info_.*', cnn_keys: 'info_.*'}

spot:
  task: spot_nav
  # Informed: terrain only in decoder as privileged CNN information
  
  batch_size: 2
  batch_length: 8
  run:
    script: train_offline
    steps: 2e7
    log_every: 300
    save_every: 3600
    sync_every: 10
    train_ratio: 256
    from_checkpoint: ''
    shuffle_episodes: true
    episode_shuffle_seed: 0
  env:
    spot:
      data_dir: / embodied/processed_data

spot_simple:
  # State-only baseline: no images/terrain, 11 scalar observations
  task: spot_nav
  batch_size: 16
  batch_length: 64
  run:
    script: train_offline
    steps: 2e7
    log_every: 300
    save_every: 600
    sync_every: 10
    train_ratio: 512
    from_checkpoint: ''
    shuffle_episodes: true
    episode_shuffle_seed: 0
  env:
    spot:
      data_dir: /embodied/processed_data_NoObs_with_rewards
  rssm: {deter: 512, units: 512, stoch: 32, classes: 16}
  encoder: {mlp_keys: 'velocity|orientation|goal', cnn_keys: '$^'}
  decoder: {mlp_keys: 'velocity|orientation|goal', cnn_keys: '$^'}
  loss_scales: {image: 0.0, vector: 1.0, reward: 1.0, cont: 1.0, dyn: 2.0, rep: 0.5, actor: 1.0, critic: 1.0, physics: 0.0, multi_step: 0.0, real_td: 0.0}
  actor: {layers: 3, units: 256, act: silu, norm: layer}
  critic: {layers: 3, units: 256, act: silu, norm: layer}
  imag_horizon: 20
  imag_warmup: 3

small:
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.units: 512
  .*\.layers: 2

medium:
  rssm.deter: 1024
  .*\.cnn_depth: 48
  .*\.units: 640
  .*\.layers: 3

large:
  rssm.deter: 2048
  .*\.cnn_depth: 64
  .*\.units: 768
  .*\.layers: 4     

xlarge:
  rssm.deter: 4096
  .*\.cnn_depth: 96
  .*\.units: 1024
  .*\.layers: 5

spot_live_frozen:
  # Online finetuning — world model FROZEN, only actor + critic train.
  # Use this as the first online finetuning step after offline pretraining
  # with physics: 1.0.  The WM is assumed good; we only adapt behaviour.
  #
  # Usage:
  #   python train_online.py \
  #     --configs spot_simple spot_live_frozen \
  #     --run.from_checkpoint /path/to/offline/checkpoint.ckpt \
  #     --logdir /path/to/online/run_frozen \
  #     --env.spotlive.goal_schedule "[[5,0],[3,2],[-4,1]]"
  task: spotlive_noobs
  jax:
    platform: gpu    # Online training should use GPU; will fallback to CPU if unavailable
    precision: float16   # GTX 1050 4GB — float32 OOMs during training JIT compile
    prealloc: false      # Do not grab all VRAM upfront
  run:
    script: train
    steps: 5e5
    train_ratio: 32
    log_every: 60
    save_every: 600
    sync_every: 10
    from_checkpoint: ''
  envs: {amount: 1, parallel: none}
  batch_size: 2
  batch_length: 8
  data_loaders: 0
  # Zero WM losses — encoder, decoder, RSSM receive no gradient
  loss_scales: {image: 0.0, vector: 0.0, reward: 0.0, cont: 0.0, dyn: 0.0, rep: 0.0, actor: 1.0, critic: 1.0, physics: 0.0, multi_step: 0.0}
  # Architecture must match the offline checkpoint (rssm256: deter=256, units=256, 3 layers)
  rssm: {deter: 256, units: 256, stoch: 32, classes: 16}
  encoder: {mlp_keys: 'velocity|position|orientation|goal', cnn_keys: '$^', mlp_layers: 3, mlp_units: 256}
  decoder: {mlp_keys: 'velocity|position|orientation|goal', cnn_keys: '$^', mlp_layers: 3, mlp_units: 256}
  actor: {layers: 3, units: 256}
  critic: {layers: 3, units: 256}
  env:
    spotlive:
      obs_keys: 'velocity|position|orientation|goal'
      policy_rate_hz: 3.5
      max_episode_steps: 30
      reach_threshold: 0.5
      goal_timeout: 300.0
      goal_schedule: null   # set via CLI: --env.spotlive.goal_schedule "[[5,0]]"

spot_live_full:
  # Online finetuning — world model AND actor + critic train together.
  # Use after spot_live_frozen if the policy still needs improvement, OR
  # when the WM needs real-data correction (e.g. goal drift persists).
  # Mixed replay (offline H5 pre-populated + live) prevents forgetting.
  #
  # Usage:
  #   python train_online.py \
  #     --configs spot_simple spot_live_full \
  #     --run.from_checkpoint /path/to/offline/checkpoint.ckpt \
  #     --logdir /path/to/online/run_full \
  #     --env.spotlive.goal_schedule "[[5,0],[3,2],[-4,1]]"
  task: spotlive_noobs
  jax:
    platform: gpu    # Online training should use GPU; will fallback to CPU if unavailable
  run:
    script: train
    steps: 5e5
    train_ratio: 32
    log_every: 60
    save_every: 600
    sync_every: 10
    from_checkpoint: ''
  envs: {amount: 1, parallel: none}
  batch_size: 8
  batch_length: 8
  # WM losses active but at reduced scale to slow adaptation
  loss_scales: {image: 0.0, vector: 0.5, reward: 1.0, cont: 1.0, dyn: 1.0, rep: 0.25, actor: 1.0, critic: 1.0, physics: 1.0, multi_step: 0.0}
  env:
    spotlive:
      obs_keys: 'velocity|position|orientation|goal'
      policy_rate_hz: 3.5
      max_episode_steps: 30
      reach_threshold: 0.5
      goal_timeout: 300.0
      goal_schedule: null   # set via CLI: --env.spotlive.goal_schedule "[[5,0]]"

cluster:
  jax:
    logical_cpus: 8
    policy_devices: [0, 1]
    train_devices: [2, 3, 4, 5, 6, 7]
  run:
    actor_batch: 4
  envs:
    amount: 8
  batch_size: 12
  batch_length: 10

debug:

  jax: {jit: True, prealloc: False, debug: True, platform: gpu}
  envs: {restart: False, amount: 1}
  wrapper: {length: 100, checks: True}
  run:
    eval_every: 1000
    log_every: 5
    save_every: 10
    train_ratio: 16
    actor_batch: 1
  batch_size: 2
  batch_length: 8
  replay_size: 5e4
  encoder.cnn_depth: 8
  decoder.cnn_depth: 8
  rssm: {deter: 32, units: 16, stoch: 4, classes: 4}
  .*unroll: False
  .*\.layers: 2
  .*\.units: 16
  .*\.wd$: 0.0

real_td:
  # Stack with spot/spot_simple to enable real-data TD critic grounding.
  # Usage: --configs spot_simple real_td
  #
  # Grounds the critic on real (post_t, r_t, post_{t+1}) consecutive
  # posterior pairs, anchoring value estimates to the latent states the
  # encoder actually visits. Without this, the critic is supervised only
  # on imagined states that drift from reality, so value predictions at
  # RSSM-drifted states are unreliable even if the reward head is accurate.
  #
  # Shorter imag_horizon is safe: the bootstrap at rollout end is now
  # calibrated by real data rather than imagination.
  #
  # Note: critic optimizer takes 2 steps per agent.train() call (imagined +
  # real). If critic becomes unstable, halve critic_opt.lr: 1.5e-5.
  loss_scales.real_td: 1.0
  imag_horizon: 10
